{# partials/toasts.html — dynamic toasts (for HTMX/Alpine push) #}
<div x-data
     x-init="$store.toasts || (Alpine.store('toasts', { items: [], push() {}, remove() {} }))"
     class="pointer-events-none fixed bottom-4 right-4 z-50 flex flex-col gap-2">
  <template x-for="toast in $store.toasts.items" :key="toast.id">
    <div class="pointer-events-auto flex items-start gap-3 rounded-md border border-surface-border
                bg-white px-4 py-3 text-sm shadow-lg
                dark:border-surface-dark-border dark:bg-surface-dark-muted"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0">
      <p class="flex-1 text-slate-800 dark:text-slate-200" x-text="toast.message"></p>
      <button type="button" @click="$store.toasts.remove(toast.id)"
              class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </template>
</div>
