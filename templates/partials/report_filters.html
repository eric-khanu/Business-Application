{# partials/report_filters.html — reusable report filter bar. Expects `form`. #}
<div class="card mb-6">
  <form method="get" class="card-body">
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-12">

      {# Date from #}
      <div class="sm:col-span-3">
        <label for="id_date_from" class="block text-xs font-medium text-slate-500 dark:text-slate-400">
          From
        </label>
        <input id="id_date_from" type="date" name="date_from"
               value="{{ form.date_from.value|default:'' }}"
               class="input mt-1">
      </div>

      {# Date to #}
      <div class="sm:col-span-3">
        <label for="id_date_to" class="block text-xs font-medium text-slate-500 dark:text-slate-400">
          To
        </label>
        <input id="id_date_to" type="date" name="date_to"
               value="{{ form.date_to.value|default:'' }}"
               class="input mt-1">
      </div>

      {# Cashier #}
      <div class="sm:col-span-3">
        <label for="id_cashier" class="block text-xs font-medium text-slate-500 dark:text-slate-400">
          Cashier
        </label>
        <select id="id_cashier" name="cashier" class="input mt-1">
          <option value="">All staff</option>
          {% for u in form.fields.cashier.queryset %}
            <option value="{{ u.pk }}"
              {% if form.cashier.value|stringformat:"s" == u.pk|stringformat:"s" %}selected{% endif %}>
              {{ u.get_full_name|default:u.username }}
            </option>
          {% endfor %}
        </select>
      </div>

      {# Payment method #}
      <div class="sm:col-span-3">
        <label for="id_payment_method" class="block text-xs font-medium text-slate-500 dark:text-slate-400">
          Payment
        </label>
        <select id="id_payment_method" name="payment_method" class="input mt-1">
          {% for value, label in form.fields.payment_method.choices %}
            <option value="{{ value }}"
              {% if form.payment_method.value == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      {# Actions #}
      <div class="flex items-end gap-2 sm:col-span-12">
        <button type="submit" class="btn-primary">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          Apply filters
        </button>

        {% if request.GET %}
          <a href="{{ request.path }}" class="btn-secondary">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
            Reset
          </a>
        {% endif %}

        {% if csv_url %}
          <a href="{{ csv_url }}" class="btn-secondary ml-auto">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Export CSV
          </a>
        {% endif %}
      </div>
    </div>
  </form>
</div>
